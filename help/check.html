<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Overlay Sections</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .section {
      height: 100vh;
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3em;
      color: white;
      transition: transform 0.5s;
    }

    .section:nth-child(1) {
      background: #1abc9c;
      z-index: -1;
    }

    .section:nth-child(2) {
      background: #3498db;
      z-index: 1;
    }

    .section:nth-child(3) {
      background: #9b59b6;
      z-index:2;
    }

    .spacer {
      height: 100vh;
    }
  </style>
</head>
<body>

  <div class="section">Section 1</div>
  <div class="spacer"></div>

  <div class="section">Section 2</div>
  <div class="spacer"></div>

  <div class="section">Section 3</div>
  <div class="spacer"></div>

</body>
</html>

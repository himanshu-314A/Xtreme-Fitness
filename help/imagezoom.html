<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zoom Out on Scroll</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 200vh; /* to allow scrolling */
      overflow-x: hidden;
    }

    .zoom-image {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.1s ease-out;
      will-change: transform;
    }
  </style>
</head>
<body>

  <img src="" alt="Zooming Image" class="zoom-image" id="zoomImg"/>

  <script>
    const image = document.getElementById('zoomImg');

    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const scaleValue = Math.max(0.5, 1 - scrollY / 1000); // Zooms out to 0.5 scale
      image.style.transform = `translate(-50%, -50%) scale(${scaleValue})`;
    });
  </script>

</body>
</html>

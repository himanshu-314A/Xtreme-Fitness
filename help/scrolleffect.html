<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery with Gaps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      perspective: 1000px;
      font-family: sans-serif;
    }

    .scroll-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: calc((100vh - (5 * 10px)) / 5); /* 5 rows minus gaps */
      gap: 10px; /* GAP between images */
      padding: 10px;
      animation: scroll 20s linear infinite;
    }

    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
      border-radius: 8px;
    }

    @keyframes scroll {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-50%);
      }
    }

    .text-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateX(90deg);
      font-size: 4vw;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 5px 10px rgba(0,0,0,0.7);
      opacity: 0;
      animation: showText 2s ease-out forwards;
      animation-delay: 2s;
      white-space: nowrap;
      pointer-events: none;
    }

    @keyframes showText {
      0% {
        transform: translate(-50%, -50%) rotateX(90deg);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) rotateX(0deg);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<div class="scroll-container">
  <div class="grid">
    <!-- 20 images + duplicated 20 images -->

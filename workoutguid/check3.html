<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Starry Background</title>
  <style>
    /* Full page background setup */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    /* Full blue sky background */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #0a0e20; /* Deep dark blue */
      z-index: -1; /* Place background behind content */
    }

    /* Star container */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      z-index: 0;
    }

    /* Individual star with blue glow */
    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #79b0ff; /* Soft blue */
      border-radius: 50%;
      box-shadow: 0 0 10px 2px #79b0ff; /* Blue glow */
      animation: twinkle 2s infinite alternate;
    }

    /* Twinkling animation */
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Main content styling */
    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      margin-top: 50px;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Full-page background container -->
  <div class="background"></div>

  <!-- Star layer -->
  <div class="stars" id="stars"></div>

  <!-- Page content -->
  <div class="content">
    <h1>Workout Guide</h1>
    <p>Let's light up your fitness journey under the stars!</p>
  </div>

  <script>
    // Generate LOTS of stars dynamically
    const starsContainer = document.getElementById('stars');
    const numberOfStars = 300; // you can increase this number for more stars

    for (let i = 0; i < numberOfStars; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = Math.random() * 100 + "vh";
      star.style.left = Math.random() * 100 + "vw";
      star.style.animationDuration = (Math.random() * 2 + 1) + "s"; // different speeds
      starsContainer.appendChild(star);
    }
  </script>

</body>
</html>

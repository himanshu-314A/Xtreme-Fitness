<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div with Background and 3D Text</title>
  <style>
    .container {
      position: relative;
      width: 500px; /* adjust width */
      height: 300px; /* adjust height */
      overflow: hidden;
      border: 2px solid #ccc; /* optional, for visibility */
    }

    .div1 {
      position: absolute;
      top:0;
      left:0;
      width: 100%;
      height: 100%;
      background-image: url('gym1.avif'); /* Replace with your image URL */
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    .div2 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 48px;
      font-weight: bold;
      z-index: 2;
      text-shadow: 
        2px 2px 4px #000, 
        4px 4px 8px #333; /* creates 3D shadow effect */
    }
  </style>
</head>
<body>

<div class="container">
  <div class="div1"></div>
  <div class="div2">3D Text Here</div>
</div>

</body>
</html>

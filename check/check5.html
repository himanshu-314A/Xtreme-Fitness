<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Fitness Feature Cards</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: radial-gradient(circle at top left, #1a1a2e, #16213e);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .columns {
      display: flex;
      gap: 100px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .feature-card {
      position: relative;
      width: 550px;
      height: 450px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      color: white;
      overflow: hidden;
      transition: transform 0.3s ease;
      padding: 20px;
    }

    .feature-card:hover {
      transform: scale(1.03);
    }

    .feature-card h2 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .feature-card p {
      font-size: 22px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .feature-card a.arrow {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 28px;
      color: #ffffffbb;
      text-decoration: none;
    }

    .feature-card img {
      width: 100px;
      height: auto;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    @media (max-width: 900px) {
      .columns {
        flex-direction: column;
        align-items: center;
      }

      .column {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="columns">
    <!-- Left Column -->
    <div class="column">
      <div class="feature-card">
        <a href="dietplanner.html" class="arrow">➔</a>
        <h2>cult transform</h2>
        <p>Get coached to lose weight for good</p>
        <img src="https://cdn-icons-png.flaticon.com/512/1940/1940922.png" alt="Weight Scale" />
      </div>

      <div class="feature-card">
        <a href="" class="arrow">➔</a>
        <h2>The .fit way</h2>
        <p>Making health easy, one day at a time</p>
        <img src="https://cdn-icons-png.flaticon.com/512/4440/4440756.png" alt="Mental Wellness" />
      </div>
    </div>

    <!-- Right Column -->
    <div class="column">
      <div class="feature-card">
        <a href="" class="arrow">➔</a>
        <h2>cult diet</h2>
        <p>Get your customized nutrition plan</p>
        <img src="https://cdn-icons-png.flaticon.com/512/2920/2920050.png" alt="Diet Plan" />
      </div>

      <div class="feature-card">
        <a href="" class="arrow">➔</a>
        <h2>Mindful minutes</h2>
        <p>Relax and train your mind daily</p>
        <img src="https://cdn-icons-png.flaticon.com/512/4035/4035480.png" alt="Mindfulness" />
      </div>
    </div>
  </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Fitness Feature Cards</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #1a1a2e, #16213e);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    .navbar {
      position: sticky;
      top: 0;
      width: 100%;
      background: #0f0f1e;
      padding: 20px 40px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .columns {
      display: flex;
      gap: 100px;
      justify-content: center;
      padding: 60px 40px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .feature-card {
      position: relative;
      width: 550px;
      height: 450px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      color: white;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 20px;
      z-index: 1;
    }

    .feature-card:hover {
      transform: scale(1.03);
    }

    .feature-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      z-index: 0;
    }

    .feature-card h2,
    .feature-card p,
    .feature-card .arrow {
      position: relative;
      z-index: 1;
    }

    .feature-card h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .feature-card p {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .feature-card a.arrow {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 28px;
      color: #ffffffbb;
      text-decoration: none;
    }

    /* Custom backgrounds for each card */
    .bg1::before {
      background-image: url('https://cdn-icons-png.flaticon.com/512/1940/1940922.png');
    }

    .bg2::before {
      background-image: url('https://cdn-icons-png.flaticon.com/512/4440/4440756.png');
    }

    .bg3::before {
      background-image: url('https://cdn-icons-png.flaticon.com/512/2920/2920050.png');
    }

    .bg4::before {
      background-image: url('https://cdn-icons-png.flaticon.com/512/4035/4035480.png');
    }

    @media (max-width: 900px) {
      .columns {
        flex-direction: column;
        align-items: center;
      }

      .column {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    FitZone
  </nav>

  <div class="columns">
    <!-- Left Column -->
    <div class="column">
      <div class="feature-card bg1">
        <a href="" class="arrow">➔</a>
        <h2>cult transform</h2>
        <p>Get coached to lose weight for good</p>
      </div>

      <div class="feature-card bg2">
        <a href="" class="arrow">➔</a>
        <h2>The .fit way</h2>
        <p>Making health easy, one day at a time</p>
      </div>
    </div>

    <!-- Right Column -->
    <div class="column">
      <div class="feature-card bg3">
        <a href="" class="arrow">➔</a>
        <h2>cult diet</h2>
        <p>Get your customized nutrition plan</p>
      </div>

      <div class="feature-card bg4">
        <a href="" class="arrow">➔</a>
        <h2>Mindful minutes</h2>
        <p>Relax and train your mind daily</p>
      </div>
    </div>
  </div>

</body>

</html>

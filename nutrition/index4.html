<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Macro Calculator</title>
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #d4fc79, #96e6a1);
      padding: 20px;
    }

    /* Container Styling */
    .container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      text-align: center;
      position: relative;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 15px;
      font-weight: 600;
      font-size: 15px;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #50c878;
      background: #fff;
      box-shadow: 0 0 5px rgba(80, 200, 120, 0.5);
      outline: none;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: #50c878;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #45b96d;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(80, 200, 120, 0.4);
    }

    /* Result Box Styling */
    #result {
      margin-top: 30px;
      padding: 20px;
      background-color: #eafff2;
      border: 2px solid #50c878;
      border-radius: 15px;
      text-align: left;
      display: none;
      max-height: 250px; /* Important */
      overflow-y: auto;
      animation: slideUp 0.6s ease forwards;
    }

    #result h3 {
      margin-bottom: 10px;
      color: #50c878;
    }

    #result p {
      margin-bottom: 8px;
      font-size: 16px;
      color: #333;
    }

    /* Scrollbar Styling for Result */
    #result::-webkit-scrollbar {
      width: 6px;
    }
    #result::-webkit-scrollbar-thumb {
      background: #50c878;
      border-radius: 10px;
    }

    /* Animations */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 500px) {
      .container {
        padding: 30px 20px;
      }
      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Macro Calculator</h2>

  <label for="age">Age:</label>
  <input type="number" id="age" placeholder="Enter your age">

  <label for="gender">Gender:</label>
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>

  <label for="weight">Weight (kg):</label>
  <input type="number" id="weight" placeholder="Enter your weight">

  <label for="height">Height (cm):</label>
  <input type="number" id="height" placeholder="Enter your height">

  <label for="activity">Activity Level:</label>
  <select id="activity">
    <option value="1.2">Sedentary</option>
    <option value="1.375">Lightly Active</option>
    <option value="1.55">Moderately Active</option>
    <option value="1.725">Very Active</option>
    <option value="1.9">Super Active</option>
  </select>

  <label for="goal">Goal:</label>
  <select id="goal">
    <option value="maintain">Maintain</option>
    <option value="lose">Lose Weight</option>
    <option value="gain">Gain Muscle</option>
  </select>

  <button onclick="calculateMacros()">Calculate</button>

  <div id="result"></div>
</div>

<script>
function calculateMacros() {
  const age = parseInt(document.getElementById("age").value);
  const gender = document.getElementById("gender").value;
  const weight = parseFloat(document.getElementById("weight").value);
  const height = parseFloat(document.getElementById("height").value);
  const activity = parseFloat(document.getElementById("activity").value);
  const goal = document.getElementById("goal").value;
  const resultDiv = document.getElementById("result");

  // Clear previous result
  resultDiv.innerHTML = "";

  // Validate fields
  if (!age || !weight || !height) {
    resultDiv.style.display = "block";
    resultDiv.innerHTML = "<p style='color:red;'>Please fill all fields properly.</p>";
    return;
  }

  // BMR Calculation
  let bmr;
  if (gender === "male") {
    bmr = 10 * weight + 6.25 * height - 5 * age + 5;
  } else {
    bmr = 10 * weight + 6.25 * height - 5 * age - 161;
  }

  // TDEE Calculation
  let tdee = bmr * activity;

  // Adjust according to goal
  if (goal === "lose") tdee *= 0.8;
  if (goal === "gain") tdee *= 1.15;

  // Macronutrient Distribution
  const proteinCals = tdee * 0.30;
  const carbCals = tdee * 0.40;
  const fatCals = tdee * 0.30;

  const proteinGrams = proteinCals / 4;
  const carbGrams = carbCals / 4;
  const fatGrams = fatCals / 9;

  // Display the result
  resultDiv.style.display = "block";
  resultDiv.innerHTML = `
    <h3>Your Daily Macros:</h3>
    <p><strong>TDEE:</strong> ${Math.round(tdee)} kcal/day</p>
    <p><strong>Protein:</strong> ${Math.round(proteinGrams)} g</p>
    <p><strong>Carbs:</strong> ${Math.round(carbGrams)} g</p>
    <p><strong>Fats:</strong> ${Math.round(fatGrams)} g</p>
  `;
}
</script>

</body>
</html>

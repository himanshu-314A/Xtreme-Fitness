<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Body Fat Calculator (Hover Enhanced)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      animation: fadeInBody 1s ease;
    }

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      animation: slideIn 1s ease;
      text-align: center;
      transition: 0.3s;
    }

    .container:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    @keyframes slideIn {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:hover, select:hover {
      background: #eaf4ff;
      border-color: #74b9ff;
      box-shadow: 0 0 10px rgba(116, 185, 255, 0.5);
    }

    input:focus, select:focus {
      border-color: #0984e3;
      outline: none;
      background: #dfefff;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #6c5ce7;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #5a4bd1;
      transform: scale(1.05);
      box-shadow: 0 8px 15px rgba(106, 90, 205, 0.4);
    }

    .result {
      margin-top: 30px;
      background: #f1f5f9;
      padding: 20px;
      border-radius: 15px;
      display: none;
      animation: popResult 0.5s ease;
      transition: 0.3s ease;
    }

    .result:hover {
      background: #e0f7fa;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transform: scale(1.02);
    }

    @keyframes popResult {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .loader {
      display: none;
      margin: 20px auto;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #6c5ce7;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Body Fat Calculator</h2>

  <label>Gender:</label>
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>

  <label>Height (feet):</label>
  <input type="number" id="height" step="0.01" placeholder="Example: 5.8">

  <label>Neck circumference (inches):</label>
  <input type="number" id="neck" placeholder="Example: 15">

  <label>Waist circumference (inches):</label>
  <input type="number" id="waist" placeholder="Example: 34">

  <div id="hipDiv" style="display:none;">
    <label>Hip circumference (inches):</label>
    <input type="number" id="hip" placeholder="Example: 38">
  </div>

  <button onclick="startCalculation()">Calculate</button>

  <div class="loader" id="loader"></div>

  <div class="result" id="result">
    <h3>Your Body Fat %:</h3>
    <p id="bodyFatResult"></p>
  </div>
</div>

<script>
  const genderSelect = document.getElementById('gender');
  const hipDiv = document.getElementById('hipDiv');

  genderSelect.addEventListener('change', function() {
    if (this.value === 'female') {
      hipDiv.style.display = 'block';
    } else {
      hipDiv.style.display = 'none';
    }
  });

  function startCalculation() {
    document.getElementById('result').style.display = 'none';
    document.getElementById('loader').style.display = 'block';

    setTimeout(calculateBodyFat, 1500);
  }

  function calculateBodyFat() {
    const gender = document.getElementById('gender').value;
    const heightFeet = parseFloat(document.getElementById('height').value);
    const neck = parseFloat(document.getElementById('neck').value);
    const waist = parseFloat(document.getElementById('waist').value);
    const hip = parseFloat(document.getElementById('hip').value);
    const resultDiv = document.getElementById('result');
    const resultText = document.getElementById('bodyFatResult');
    const loader = document.getElementById('loader');

    loader.style.display = 'none';

    if (!heightFeet || !neck || !waist || (gender === 'female' && !hip)) {
      alert('⚠️ Please fill all fields correctly!');
      return;
    }

    const height = heightFeet * 12;

    let bodyFat;
    try {
      if (gender === 'male') {
        if (waist <= neck) throw new Error("Waist must be larger than Neck!");
        bodyFat = 86.010 * Math.log10(waist - neck) - 70.041 * Math.log10(height) + 36.76;
      } else {
        if ((waist + hip) <= neck) throw new Error("Waist + Hip must be larger than Neck!");
        bodyFat = 163.205 * Math.log10(waist + hip - neck) - 97.684 * Math.log10(height) - 78.387;
      }

      if (bodyFat < 0 || bodyFat > 70) {
        resultDiv.style.display = 'block';
        resultText.innerHTML = "⚠️ Error: Please recheck your inputs!";
      } else {
        resultDiv.style.display = 'block';
        resultText.innerHTML = `<strong>${bodyFat.toFixed(2)}%</strong>`;
      }
    } catch (error) {
      alert(`Error: ${error.message}`);
    }
  }
</script>

</body>
</html>

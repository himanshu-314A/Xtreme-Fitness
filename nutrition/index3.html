<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Macro Calculator</title>
  <style>
    /* Body Styling */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      font-family: 'Poppins', sans-serif;
    }

    /* Container Box */
    .container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: fadeIn 1s ease-in;
    }

    /* Heading */
    h2 {
      margin-bottom: 20px;
      color: #333;
      font-weight: 700;
    }

    /* Labels */
    label {
      display: block;
      text-align: left;
      margin-top: 15px;
      font-weight: 600;
      color: #555;
    }

    /* Inputs and Selects */
    select, input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    select:focus, input:focus {
      border-color: #66a6ff;
      box-shadow: 0 0 5px rgba(102,166,255,0.5);
    }

    /* Button */
    button {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    /* Result Box */
    #result {
      margin-top: 30px;
      padding: 25px;
      background-color: #f5faff;
      border: 2px dashed #007bff;
      border-radius: 12px;
      text-align: left;
      animation: slideUp 1s ease;
    }

    #result h3 {
      margin-top: 0;
      color: #007bff;
      font-weight: 700;
    }

    /* Animations */
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.95);}
      to {opacity: 1; transform: scale(1);}
    }

    @keyframes slideUp {
      from {transform: translateY(30px); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Macro Calculator</h2>

  <label>Age:
    <input type="number" id="age" placeholder="Enter your age">
  </label>

  <label>Gender:
    <select id="gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>
  </label>

  <label>Weight (kg):
    <input type="number" id="weight" placeholder="Enter your weight">
  </label>

  <label>Height (cm):
    <input type="number" id="height" placeholder="Enter your height">
  </label>

  <label>Activity Level:
    <select id="activity">
      <option value="1.2">Sedentary</option>
      <option value="1.375">Lightly Active</option>
      <option value="1.55">Moderately Active</option>
      <option value="1.725">Very Active</option>
      <option value="1.9">Super Active</option>
    </select>
  </label>

  <label>Goal:
    <select id="goal">
      <option value="maintain">Maintain</option>
      <option value="lose">Lose Weight</option>
      <option value="gain">Gain Muscle</option>
    </select>
  </label>

  <button onclick="calculateMacros()">Calculate</button>

  <div id="result"></div>
</div>

<script>
function calculateMacros() {
  const age = parseInt(document.getElementById("age").value);
  const gender = document.getElementById("gender").value;
  const weight = parseFloat(document.getElementById("weight").value);
  const height = parseFloat(document.getElementById("height").value);
  const activity = parseFloat(document.getElementById("activity").value);
  const goal = document.getElementById("goal").value;

  if (!age || !weight || !height) {
    document.getElementById("result").innerHTML = "<p style='color:red;'>Please fill all fields.</p>";
    return;
  }

  let bmr;
  if (gender === "male") {
    bmr = 10 * weight + 6.25 * height - 5 * age + 5;
  } else {
    bmr = 10 * weight + 6.25 * height - 5 * age - 161;
  }

  let tdee = bmr * activity;

  if (goal === "lose") tdee *= 0.8;
  if (goal === "gain") tdee *= 1.15;

  const proteinCals = tdee * 0.30;
  const carbCals = tdee * 0.40;
  const fatCals = tdee * 0.30;

  const proteinGrams = proteinCals / 4;
  const carbGrams = carbCals / 4;
  const fatGrams = fatCals / 9;

  document.getElementById("result").innerHTML = `
    <h3>Results:</h3>
    <p><strong>TDEE:</strong> ${Math.round(tdee)} kcal/day</p>
    <p><strong>Protein:</strong> ${Math.round(proteinGrams)}g/day</p>
    <p><strong>Carbs:</strong> ${Math.round(carbGrams)}g/day</p>
    <p><strong>Fats:</strong> ${Math.round(fatGrams)}g/day</p>
  `;
}
</script>

</body>
</html>

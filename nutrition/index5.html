<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Macro Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: linear-gradient(135deg, #c3ecb2, #7ed6df);
      font-family: 'Poppins', sans-serif;
      animation: fadeBody 1s ease-in;
      padding: 20px;
      background-image: url(image.png);
      background-repeat: no-repeat;
      background-size: cover;
    }

    .container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 1s ease forwards;
      margin-right: 250px;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 30px;
      color: #333;
      font-weight: bold;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 18px;
      font-weight: 600;
      font-size: 15px;
      color: #444;
      margin-bottom: 5px;
      transition: 0.3s;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #f8f8f8;
      font-size: 16px;
      transition: 0.3s;
    }

    input:focus,
    select:focus {
      border-color: #6ab04c;
      background: #fff;
      box-shadow: 0 0 10px rgba(106, 176, 76, 0.4);
      outline: none;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #6ab04c, #badc58);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(106, 176, 76, 0.5);
    }

    #result {
      margin-top: 30px;
      padding: 25px;
      background-color: #f1fff3;
      border: 2px solid #6ab04c;
      border-radius: 15px;
      text-align: left;
      display: none;
      max-height: 250px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(106, 176, 76, 0.2);
      animation: fadeResult 1s ease forwards;
    }

    #result h3 {
      margin-bottom: 12px;
      color: #6ab04c;
    }

    #result p {
      margin-bottom: 10px;
      font-size: 16px;
      color: #333;
    }

    #result::-webkit-scrollbar {
      width: 6px;
    }

    #result::-webkit-scrollbar-thumb {
      background: #6ab04c;
      border-radius: 10px;
    }

    .spinner {
      display: none;
      width: 40px;
      height: 40px;
      border: 4px solid #eee;
      border-top: 4px solid #6ab04c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto 0;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeBody {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeResult {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 20px;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Macro Calculator</h2>

    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Enter your age">

    <label for="gender">Gender</label>
    <select id="gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>

    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter your weight">

    <label for="height">Height (cm)</label>
    <input type="number" id="height" placeholder="Enter your height">

    <label for="activity">Activity Level</label>
    <select id="activity">
      <option value="1.2">Sedentary</option>
      <option value="1.375">Lightly Active</option>
      <option value="1.55">Moderately Active</option>
      <option value="1.725">Very Active</option>
      <option value="1.9">Super Active</option>
    </select>

    <label for="goal">Goal</label>
    <select id="goal">
      <option value="maintain">Maintain</option>
      <option value="lose">Lose Weight</option>
      <option value="gain">Gain Muscle</option>
    </select>

    <button onclick="calculateMacros()">Calculate</button>

    <div class="spinner" id="spinner"></div>

    <div id="result"></div>
  </div>

  <script>
    function calculateMacros() {
      const age = parseInt(document.getElementById("age").value);
      const gender = document.getElementById("gender").value;
      const weight = parseFloat(document.getElementById("weight").value);
      const height = parseFloat(document.getElementById("height").value);
      const activity = parseFloat(document.getElementById("activity").value);
      const goal = document.getElementById("goal").value;
      const resultDiv = document.getElementById("result");
      const spinner = document.getElementById("spinner");

      // Clear previous result
      resultDiv.style.display = "none";
      resultDiv.innerHTML = "";

      // Show spinner
      spinner.style.display = "block";

      setTimeout(() => {
        spinner.style.display = "none";

        if (!age || !weight || !height) {
          resultDiv.style.display = "block";
          resultDiv.innerHTML = "<p style='color:red;'>Please fill all fields correctly.</p>";
          return;
        }

        let bmr;
        if (gender === "male") {
          bmr = 10 * weight + 6.25 * height - 5 * age + 5;
        } else {
          bmr = 10 * weight + 6.25 * height - 5 * age - 161;
        }

        let tdee = bmr * activity;

        if (goal === "lose") tdee *= 0.8;
        if (goal === "gain") tdee *= 1.15;

        const proteinCals = tdee * 0.30;
        const carbCals = tdee * 0.40;
        const fatCals = tdee * 0.30;

        const proteinGrams = proteinCals / 4;
        const carbGrams = carbCals / 4;
        const fatGrams = fatCals / 9;

        resultDiv.style.display = "block";
        resultDiv.innerHTML = `
      <h3>Your Daily Macros:</h3>
      <p><strong>TDEE:</strong> ${Math.round(tdee)} kcal/day</p>
      <p><strong>Protein:</strong> ${Math.round(proteinGrams)} g</p>
      <p><strong>Carbs:</strong> ${Math.round(carbGrams)} g</p>
      <p><strong>Fats:</strong> ${Math.round(fatGrams)} g</p>
    `;
      }, 1000); // 1 second spinner effect
    }
  </script>

</body>

</html>
